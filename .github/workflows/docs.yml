name: Docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    # Observed ~26s (Sphinx+MyST install, gen_reference.py, one
    # sphinx-build -W run). 10m is generous headroom for apt/pip variance;
    # a job this small legitimately hanging that long almost certainly
    # means a real stall, not slowness (see GitHub issue #150, which is
    # about exactly this class of undetected hang on a sibling workflow).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Sphinx + MyST (Ubuntu archive)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-sphinx python3-myst-parser python3-sphinx-rtd-theme

      - name: Generate options/modules reference
        run: python3 docs/gen_reference.py

      - name: Build Sphinx site
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      # No configure-pages step: it fails while Pages is not yet enabled
      # (issue #11), and upload-pages-artifact does not require it.
      # PM decision — see issue #4 integration notes.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages not yet enabled by owner — see issue #11; flip to strict once enabled
    continue-on-error: true
    # One actions/deploy-pages call, no build work of its own -- expected to
    # be fast/fail-fast today (issue #11: Pages isn't enabled yet, hence
    # continue-on-error above). 10m matches the "build" job's own headroom
    # for the same class of "small job, generous but not unbounded" ceiling
    # (issue #150).
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
